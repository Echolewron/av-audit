name: Auto-Sync package.json Version on Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract Tag and Update Version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # Extract clean version without leading 'v'
          VERSION="${RELEASE_TAG#v}"
          echo "Updating package.json to version: $VERSION"
          
          node -e "
            const fs = require('fs');
            const ver = process.env.VERSION;
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = ver;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            if (fs.existsSync('package-lock.json')) {
              const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
              lock.version = ver;
              if (lock.packages && lock.packages['']) lock.packages[''].version = ver;
              fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');
            }
          "
        env:
          VERSION: ${{ github.event.release.tag_name }}

      - name: Commit, Push, and Update Release Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          TAG="${{ github.event.release.tag_name }}"
          git add package.json package-lock.json
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "chore(release): bump version to $TAG [skip ci]"
            git push origin main
            
            # Re-point the release tag to this new commit with updated package.json
            git tag -f "$TAG"
            git push origin "$TAG" --force
          fi
